version: 2

project_name: spool

builds:
  - id: spool
    main: .
    binary: spool
    env:
      - CGO_ENABLED=0
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/monojitgoswami69/spool/cmd.Version={{.Version}}
      - -X github.com/monojitgoswami69/spool/cmd.BuildTime={{.Date}}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"